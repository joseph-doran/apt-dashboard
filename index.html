/* 비밀번호로 임베드 데이터 복호화 (PBKDF2 + AES-GCM, Web Crypto) */
async function decryptData(enc, password) {
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const salt = b(enc.salt), iv = b(enc.iv), data = b(enc.ct);
  const baseKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: enc.iter, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(pt));
}
/* 동기화용: 객체를 비밀번호로 암호화 ({salt,iv,ct,iter}) */
async function encryptData(obj, password) {
  const te = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const iter = 150000;
  const baseKey = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const ctBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  return { salt: b64(salt.buffer), iv: b64(iv.buffer), ct: b64(ctBuf), iter };
}
/* 비밀번호 → 동기화 경로용 SHA-256 hex */
async function sha256hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

/* ====================== 포맷 유틸 ====================== */
function won(v) {
  if (v == null) return "-";
  const r = Math.round((v / 1e8) * 100) / 100;
  return r.toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "억";
}
function manwon(v) {
  if (v == null) return "-";
  return Math.round(v / 1e4).toLocaleString("ko-KR") + "만";
}
function pct(v, d = 1) { return v == null || isNaN(v) ? "-" : v.toFixed(d) + "%"; }
function signPct(v, d = 2) { if (v == null || isNaN(v)) return "-"; return (v > 0 ? "+" : "") + v.toFixed(d) + "%"; }

/* ====================== 지역/키/날짜 ====================== */
function provDist(d) {
  const province = d.source;
  const district =
    province === "서울" ? d.region2 || d.region1 || "기타" : d.region1 || d.region2 || "기타";
  return { province, district };
}
function keyOf(d) {
  const { province, district } = provDist(d);
  return [province, district, d.complex_name, d.size].join("|");
}
function dateSortVal(s) {
  if (!s) return Number.MAX_SAFE_INTEGER;
  const t = Date.parse(s);
  if (!isNaN(t)) return t;
  // "2026년 5월 2주" / "2026년 5월" 같은 한글 라벨을 실제 날짜로 환산해 정렬
  const m = String(s).match(/(\d{4})\s*년\s*(\d{1,2})\s*월(?:\s*(\d{1,2})\s*주)?/);
  if (m) return Date.UTC(+m[1], +m[2] - 1, Math.min(28, ((m[3] ? +m[3] : 1) - 1) * 7 + 1));
  return Number.MAX_SAFE_INTEGER;
}

/* ====================== 오버레이(localStorage) ====================== */
function loadOverlay() {
  try {
    const o = JSON.parse(localStorage.getItem(OVERLAY_KEY) || "{}");
    return { edits: o.edits || {}, news: o.news || [], noListing: o.noListing || {} };
  } catch (e) {
    return { edits: {}, news: [], noListing: {} };
  }
}
function saveOverlay(o) {
  localStorage.setItem(OVERLAY_KEY, JSON.stringify(o));
}
/* 두 오버레이 병합 (첫 동기화 시 기기별 입력 보존; 충돌은 a 우선) */
function mergeOverlay(a, b) {
  const out = { edits: { ...(b.edits || {}) }, news: [...(b.news || [])], noListing: { ...(b.noListing || {}), ...(a.noListing || {}) } };
  Object.entries(a.edits || {}).forEach(([k, ed]) => {
    const base = out.edits[k] ? [...(out.edits[k].history || [])] : [];
    const byDate = new Map(base.map((h) => [h.date, h]));
    (ed.history || []).forEach((h) => byDate.set(h.date, { ...(byDate.get(h.date) || {}), ...h }));
    out.edits[k] = { history: [...byDate.values()] };
  });
  (a.news || []).forEach((n) => { if (!out.news.some((x) => keyOf(x) === keyOf(n))) out.news.push(n); });
  return out;
}

/* 원본 + 오버레이 병합 → 원본 스키마 데이터셋(내보내기/렌더 공용) */
function buildDataset(overlay) {
  const map = new Map();
  RAW.forEach((d) => map.set(keyOf(d), { ...d, history: d.history.map((h) => ({ ...h })) }));
  // 사용자가 추가한 신규 단지
  (overlay.news || []).forEach((b) => {
    const k = keyOf(b);
    if (!map.has(k)) map.set(k, { ...b, history: [] });
  });
  // 시세 입력/수정 병합 (날짜 기준 dedupe, 입력값 우선)
  Object.entries(overlay.edits || {}).forEach(([k, ed]) => {
    const rec = map.get(k);
    if (!rec) return;
    const byDate = new Map(rec.history.map((h) => [h.date, h]));
    (ed.history || []).forEach((h) => byDate.set(h.date, { ...(byDate.get(h.date) || {}), ...h }));
    rec.history = [...byDate.values()].sort((a, b) => dateSortVal(a.date) - dateSortVal(b.date));
  });
  return [...map.values()];
}

      datasets = [{ ...base, label: "전세가율", data: complex.history.map((h) => (h.price != null && h.rent != null ? +((h.rent / h.price) * 100).toFixed(1) : null)), borderColor: "#10b981", backgroundColor: mkGrad("#10b981"), pointBackgroundColor: "#10b981" }];
      yFmt = (v) => v + "%"; tipFmt = (c) => "전세가율: " + pct(c.parsed.y);
    } else {
      datasets = [{ ...base, label: "매매 평당가", data: complex.history.map((h) => h.per_pyung_price), borderColor: "#8b5cf6", backgroundColor: mkGrad("#8b5cf6"), pointBackgroundColor: "#8b5cf6" }];
      yFmt = (v) => Math.round(v / 1e4).toLocaleString() + "만"; tipFmt = (c) => "평당가: " + manwon(c.parsed.y);
    }
    chartRef.current = new Chart(ctx, {
      type: "line", data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: tab === "price", position: "top", align: "end", labels: { color: legendColor, usePointStyle: true, pointStyle: "circle", boxWidth: 8, padding: 16, font: { size: 12, weight: "600" } } },
          tooltip: { backgroundColor: dark ? "rgba(15,23,42,.95)" : "rgba(255,255,255,.97)", titleColor: dark ? "#e2e8f0" : "#0f172a", bodyColor: dark ? "#cbd5e1" : "#334155", borderColor: dark ? "rgba(148,163,184,.2)" : "rgba(100,116,139,.2)", borderWidth: 1, padding: 12, cornerRadius: 10, usePointStyle: true, callbacks: { label: tipFmt } },
        },
        scales: {
          x: { grid: { color: grid, drawTicks: false }, ticks: { color: ticks, font: { size: 11 } }, border: { display: false } },
          y: { grid: { color: grid, drawTicks: false }, ticks: { color: ticks, font: { size: 11 }, callback: yFmt, maxTicksLimit: 6 }, border: { display: false } },
        },
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [complex, tab, dark]);

  if (!complex) return (<div className="flex h-[420px] flex-col items-center justify-center gap-3 text-slate-400"><Icon.Chart size={48} className="opacity-40" /><p className="text-sm">표시할 단지를 선택하세요.</p></div>);

  const LowTag = () => (<span className="ml-1 rounded bg-rose-500/15 px-1 py-0.5 text-[10px] font-bold text-rose-600 dark:text-rose-400" title="저층(1~3층) 매물만 있는 시세">저층</span>);
  const lastDealE = [...complex.history].reverse().find((h) => h.price != null);
  const lastRentE = [...complex.history].reverse().find((h) => h.rent != null);
  const DetailBox = ({ label, e, minK, maxK, avgK, cntK, badgeCls }) => (
    <div className="rounded-xl border border-slate-200/70 dark:border-white/10 bg-slate-50/60 dark:bg-white/[0.02] px-3.5 py-2.5">

  return (

        <div>

          </p>

/* ====================== 평균 전세가율 추이 (회차별) ====================== */
function RatioTrend({ rows, dark }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const METRICS = [
    { key: "ratio", label: "전세가율", color: "#10b981", fmt: (v) => v.toFixed(1) + "%", axis: "pct" },
    { key: "deal", label: "매매가", color: "#6366f1", fmt: (v) => won(v), axis: "won" },
    { key: "rent", label: "전세가", color: "#f59e0b", fmt: (v) => won(v), axis: "won" }, // 매매가와 같은 축(원)
    { key: "pp", label: "평당가", color: "#8b5cf6", fmt: (v) => manwon(v), axis: "pp" },
  ];
  const REGIONS = [{ key: "all", label: "전체", dash: [] }, { key: "seoul", label: "서울", dash: [6, 3] }, { key: "gyeonggi", label: "경기", dash: [2, 3] }];
  const [sel, setSel] = useState({ ratio: true, deal: false, rent: false, pp: false });
  const [reg, setReg] = useState({ all: true, seoul: false, gyeonggi: false });
  const [hidden, setHidden] = useState({}); // 숨긴 회차
  const [showDates, setShowDates] = useState(false);
  const { allDates, byDate } = useMemo(() => {
    const roundDates = new Set();
    RAW.forEach((d) => (d.history || []).forEach((h) => roundDates.add(h.date)));
    const scopes = { all: rows, seoul: rows.filter((r) => r.province === "서울"), gyeonggi: rows.filter((r) => r.province === "경기") };
    const acc = {}; // date -> { all:{ratio:[],deal:[],rent:[],pp:[]}, seoul:{...}, gyeonggi:{...} }
    Object.entries(scopes).forEach(([rk, rrows]) => rrows.forEach((r) => (r.history || []).forEach((h) => {
      if (!roundDates.has(h.date)) return;
      const a = (acc[h.date] = acc[h.date] || {});
      const g = (a[rk] = a[rk] || { ratio: [], deal: [], rent: [], pp: [] });
      if (h.price != null && h.rent != null) g.ratio.push((h.rent / h.price) * 100);
      if (h.price != null) g.deal.push(h.price);
      if (h.rent != null) g.rent.push(h.rent);
      if (h.per_pyung_price != null) g.pp.push(h.per_pyung_price);
    })));
    const avg = (arr) => (arr && arr.length ? arr.reduce((x, y) => x + y, 0) / arr.length : null);
    const dates = Object.keys(acc).sort((a, b) => dateSortVal(a) - dateSortVal(b));
    const bd = {};
    dates.forEach((d) => { bd[d] = {}; ["all", "seoul", "gyeonggi"].forEach((rk) => { const g = acc[d][rk]; bd[d][rk] = { ratio: avg(g && g.ratio), deal: avg(g && g.deal), rent: avg(g && g.rent), pp: avg(g && g.pp) }; }); });
    return { allDates: dates, byDate: bd };
  }, [rows]);
  const shownDates = useMemo(() => allDates.filter((d) => !hidden[d]), [allDates, hidden]);
  const selMetrics = METRICS.filter((m) => sel[m.key]);
  const selRegions = REGIONS.filter((r) => reg[r.key]);
  const selKey = selMetrics.map((m) => m.key).join(",") + "|" + selRegions.map((r) => r.key).join(",");

  useEffect(() => {
    if (!canvasRef.current || !shownDates.length) return;
    const ctx = canvasRef.current.getContext("2d");
    if (chartRef.current) chartRef.current.destroy();
    const grid = dark ? "rgba(148,163,184,.12)" : "rgba(100,116,139,.14)";
    const ticks = dark ? "#94a3b8" : "#64748b";
    const mets = METRICS.filter((m) => sel[m.key]);
    const regs = REGIONS.filter((r) => reg[r.key]);
    const pairs = [];
    mets.forEach((m) => regs.forEach((rg) => pairs.push({ m, rg })));
    const datasets = pairs.map(({ m, rg }) => ({
      label: m.label + (regs.length > 1 ? "·" + rg.label : ""),
      data: shownDates.map((d) => byDate[d][rg.key][m.key]),
      borderColor: m.color, backgroundColor: m.color + "22", borderDash: rg.dash, yAxisID: "y_" + m.axis,
      fill: false, tension: 0.35, spanGaps: true, pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: m.color, borderWidth: 2.5,
    }));
    const scales = { x: { grid: { color: grid, drawTicks: false }, ticks: { color: ticks, font: { size: 11 } }, border: { display: false } } };
    [...new Set(mets.map((m) => m.axis))].forEach((ax) => { scales["y_" + ax] = { display: false }; }); // 같은 단위는 축 공유
    chartRef.current = new Chart(ctx, {
      type: "line",
      data: { labels: shownDates, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: { backgroundColor: dark ? "rgba(15,23,42,.95)" : "rgba(255,255,255,.97)", titleColor: dark ? "#e2e8f0" : "#0f172a", bodyColor: dark ? "#cbd5e1" : "#334155", borderColor: dark ? "rgba(148,163,184,.2)" : "rgba(100,116,139,.2)", borderWidth: 1, padding: 10, cornerRadius: 10, usePointStyle: true, callbacks: { label: (c) => {
            const p = pairs[c.datasetIndex], cur = c.parsed.y, i = c.dataIndex;
            let s = p.m.label + (regs.length > 1 ? "·" + p.rg.label : "") + ": " + (cur != null ? p.m.fmt(cur) : "-");
            if (i > 0 && cur != null) {
              const prev = byDate[shownDates[i - 1]][p.rg.key][p.m.key];
              if (prev != null && prev !== 0) {
                if (p.m.key === "ratio") { const d = cur - prev; s += " (직전 " + (d >= 0 ? "+" : "") + d.toFixed(1) + "%p)"; }
                else { const ch = ((cur - prev) / prev) * 100; s += " (직전 " + (ch >= 0 ? "+" : "") + ch.toFixed(1) + "%)"; }
              }
            }
            return s;
          } } },
        },
        scales,
      },
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [shownDates, selKey, dark, byDate]);

  if (!allDates.length) return null;
  return (
    <div className="rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass p-5 shadow-sm">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h3 className="flex items-center gap-1.5 text-lg font-bold text-slate-900 dark:text-white"><Icon.Chart size={18} /> 회차별 지표 추이</h3>
          <p className="text-xs text-slate-500 dark:text-slate-400">회차(수집일)별 단지 평균 · 지표마다 자체 축, 정확한 값은 툴팁</p>
        </div>
        <button onClick={() => setShowDates((v) => !v)} className="rounded-md border border-slate-200 dark:border-white/10 px-2.5 py-1.5 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">{showDates ? "회차 닫기" : "회차 선택"}</button>
      </div>
      <div className="mt-3 flex flex-wrap gap-2">
        {METRICS.map((m) => (
          <button key={m.key} onClick={() => setSel((s) => ({ ...s, [m.key]: !s[m.key] }))} className={"inline-flex items-center gap-1.5 rounded-lg border px-2.5 py-1.5 text-xs font-semibold transition " + (sel[m.key] ? "border-transparent text-white" : "border-slate-200 dark:border-white/10 text-slate-500 dark:text-slate-400 hover:text-slate-700")} style={sel[m.key] ? { backgroundColor: m.color } : {}}>
            <span className="inline-block h-2.5 w-2.5 rounded-full" style={{ backgroundColor: sel[m.key] ? "#ffffff" : m.color }}></span>{m.label}
          </button>
        ))}
      </div>
      <div className="mt-2 flex flex-wrap items-center gap-2">
        <span className="text-[11px] font-semibold text-slate-400">지역</span>
        {REGIONS.map((rg) => (
          <button key={rg.key} onClick={() => setReg((s) => ({ ...s, [rg.key]: !s[rg.key] }))} className={"rounded-lg border px-2.5 py-1.5 text-xs font-semibold transition " + (reg[rg.key] ? "border-brand-400 bg-brand-500/10 text-brand-600 dark:text-brand-300" : "border-slate-200 dark:border-white/10 text-slate-500 dark:text-slate-400 hover:text-slate-700")}>{reg[rg.key] ? "✓ " : ""}{rg.label}</button>
        ))}
        {selRegions.length > 1 && <span className="text-[11px] text-slate-400">(점선 = 서울·경기 구분)</span>}
      </div>
      {showDates && (
        <div className="mt-2 rounded-xl border border-slate-200/70 dark:border-white/10 bg-slate-50/60 dark:bg-white/[0.02] p-2">
          <div className="mb-1.5 flex items-center gap-1.5">
            <button onClick={() => setHidden({})} className="rounded-md bg-brand-500/10 px-2 py-1 text-[11px] font-semibold text-brand-600 dark:text-brand-300 hover:bg-brand-500/20">전체 선택</button>
            <button onClick={() => setHidden(Object.fromEntries(allDates.map((d) => [d, true])))} className="rounded-md bg-slate-400/10 px-2 py-1 text-[11px] font-semibold text-slate-500 dark:text-slate-400 hover:bg-slate-400/20">전체 해제</button>
            <span className="ml-auto text-[11px] text-slate-400">{shownDates.length}/{allDates.length} 회차 표시</span>
          </div>
          <div className="flex flex-wrap gap-1.5">
            {allDates.map((d) => (
              <button key={d} onClick={() => setHidden((h) => ({ ...h, [d]: !h[d] }))} className={"rounded-md px-2 py-1 text-[11px] font-medium transition " + (!hidden[d] ? "bg-brand-500/15 text-brand-600 dark:text-brand-300" : "bg-slate-200/60 dark:bg-white/5 text-slate-400")}>{!hidden[d] ? "✓ " : ""}{d}</button>
            ))}
          </div>
        </div>
      )}
      {selMetrics.length === 0 && <p className="mt-3 text-center text-xs text-slate-400">표시할 지표를 선택하세요.</p>}
      {selMetrics.length > 0 && selRegions.length === 0 && <p className="mt-3 text-center text-xs text-slate-400">지역(전체/서울/경기)을 선택하세요.</p>}
      {selMetrics.length > 0 && selRegions.length > 0 && shownDates.length === 0 && <p className="mt-3 text-center text-xs text-slate-400">표시할 회차를 선택하세요. ("회차 선택" → 회차 클릭)</p>}
      <div className="mt-3 h-[300px] sm:h-[340px]"><canvas ref={canvasRef}></canvas></div>
    </div>
  );
}

/* ====================== 회차별 최고 변동 모달 (직전 대비) ====================== */
function MoversModal({ rows, onClose }) {
  const data = useMemo(() => {
    const roundDates = new Set();
    RAW.forEach((d) => (d.history || []).forEach((h) => roundDates.add(h.date)));
    const byDate = {};
    rows.forEach((r) => {
      const ph = (r.history || []).filter((h) => h.price != null && roundDates.has(h.date)).sort((a, b) => dateSortVal(a.date) - dateSortVal(b.date));
      for (let i = 1; i < ph.length; i++) {
        if (!ph[i - 1].price) continue;
        const change = ((ph[i].price - ph[i - 1].price) / ph[i - 1].price) * 100;
        (byDate[ph[i].date] = byDate[ph[i].date] || []).push({ name: r.complex_name, size: r.size, change });
      }
    });
    return Object.entries(byDate).map(([date, arr]) => {
      let top = null, bot = null;
      arr.forEach((x) => { if (!top || x.change > top.change) top = x; if (!bot || x.change < bot.change) bot = x; });
      return { date, top, bot };
    }).sort((a, b) => dateSortVal(b.date) - dateSortVal(a.date));
  }, [rows]);

  const Cell = ({ m, up }) => m ? (
    <div className="flex items-center justify-between gap-2">
      <span className="truncate text-slate-700 dark:text-slate-200">{m.name}<span className="ml-1 text-xs text-slate-400">{m.size}평</span></span>
      <span className={"shrink-0 font-bold " + (up ? "text-rose-600 dark:text-rose-400" : "text-blue-600 dark:text-blue-400")}>{signPct(m.change)}</span>
    </div>
  ) : <span className="text-slate-400">-</span>;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onClick={onClose}></div>
      <div className="relative flex max-h-[85vh] w-full max-w-2xl flex-col animate-pop rounded-2xl border border-slate-200 dark:border-white/10 bg-white dark:bg-slate-900 p-6 shadow-2xl">
        <div className="flex items-center justify-between">
          <div>
            <h3 className="flex items-center gap-1.5 text-lg font-bold text-slate-900 dark:text-white"><Icon.TrendUp size={18} /> 회차별 최고 변동</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400">각 회차(수집일)의 직전 대비 매매가 최고 상승·하락 단지 (최신순)</p>
          </div>
          <button onClick={onClose} className="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10"><Icon.Close size={18} /></button>
        </div>
        {!data.length ? <p className="mt-6 text-center text-sm text-slate-400">표시할 회차 데이터가 없습니다.</p> : (
          <div className="mt-3 overflow-y-auto">
            <table className="w-full text-left text-sm">
              <thead className="sticky top-0 bg-white dark:bg-slate-900"><tr className="text-xs text-slate-500 dark:text-slate-400"><th className="py-2 pr-2 font-semibold">회차</th><th className="py-2 px-2 font-semibold">📈 최고 상승</th><th className="py-2 pl-2 font-semibold">📉 최고 하락</th></tr></thead>
              <tbody className="divide-y divide-slate-100 dark:divide-white/[0.06]">
                {data.map((d) => (
                  <tr key={d.date}>
                    <td className="whitespace-nowrap py-2.5 pr-2 text-xs font-medium text-slate-500 dark:text-slate-400">{d.date}</td>
                    <td className="py-2.5 px-2"><Cell m={d.top} up={true} /></td>
                    <td className="py-2.5 pl-2"><Cell m={d.bot} up={false} /></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

/* ====================== 저평가 발굴 (스코어 + 상승전환 교차) ====================== */

  const scoreCls = (s) => s >= 85 ? "bg-emerald-500 text-white" : s >= 70 ? "bg-emerald-500/20 text-emerald-700 dark:text-emerald-300" : "bg-slate-200 dark:bg-white/10 text-slate-600 dark:text-slate-300";
  return (
    <div className="rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass p-5 shadow-sm">

        <h3 className="flex items-center gap-1.5 text-lg font-bold text-slate-900 dark:text-white"><Icon.Percent size={18} /> 저평가 발굴</h3>
        <button onClick={() => setShowFormula((v) => !v)} className="rounded-md border border-slate-200 dark:border-white/10 px-2 py-1 text-[11px] font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">{showFormula ? "산식 닫기" : "ⓘ 산식"}</button>
      </div>
      <p className="text-xs text-slate-500 dark:text-slate-400">전세가율·평당가 기반 점수(0~100). 🔥 = 직전 회차 대비 상승(저평가+상승전환)</p>
      {showFormula && (
        <div className="mt-2 rounded-xl border border-slate-200/70 dark:border-white/10 bg-slate-50/70 dark:bg-white/[0.03] p-3 text-[11px] leading-relaxed text-slate-600 dark:text-slate-300">
          <p className="font-bold text-slate-700 dark:text-slate-200">저평가 스코어 (0~100)</p>
          <p className="mt-1 font-mono text-[11px] text-slate-700 dark:text-slate-200">= 전세가율 백분위 × 0.65 + 평당가 저렴도 백분위 × 0.35</p>
          <ul className="mt-2 space-y-1 list-disc pl-4">
            <li><b>전세가율 백분위</b>: 추적 단지 중 전세가율(전세÷매매)이 높을수록 ↑ — 매매가가 전세 대비 낮음 = 저평가</li>
            <li><b>평당가 저렴도 백분위</b>: 평당가가 낮을수록 ↑ — 가성비</li>
            <li><b>🔥</b>: 스코어 60↑ & 직전 회차 대비 매매가 <b>상승</b> (저평가 + 상승전환)</li>
          </ul>
          <p className="mt-2 text-slate-400">※ 추적 99개 단지 내 <b>상대</b> 점수 · 호가 기준 — 선별용(절대 저평가 아님)</p>
        </div>
      )}
      <div className="mt-3 max-h-[260px] space-y-1.5 overflow-y-auto pr-1">
        {list.map((r) => (
          <div key={r._id} onClick={() => onPick && onPick(r)} className="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200/70 dark:border-white/10 bg-slate-50/60 dark:bg-white/[0.02] px-3 py-2 hover:bg-slate-100 dark:hover:bg-white/[0.05] transition">
            <span className={"grid h-9 w-9 shrink-0 place-items-center rounded-lg text-sm font-bold " + scoreCls(r.valueScore)}>{r.valueScore}</span>
            <div className="min-w-0 flex-1">
              <p className="truncate text-sm font-semibold text-slate-800 dark:text-slate-100">{r.complex_name}<span className="ml-1 text-xs font-medium text-slate-400">{r.size}평</span>{r.changePct > 0 && <span className="ml-1.5 text-xs">🔥</span>}</p>
              <p className="text-xs text-slate-500 dark:text-slate-400">{r.province} {r.district} · {won(r.latestPrice)} · 전세가율 {pct(r.jeonseRatio)} · 평당 {manwon(r.latestPP)}</p>
            </div>
            {r.changePct != null && <ChangeBadge v={r.changePct} />}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ====================== 쌍둥이 단지 (국토부 실거래가 · 추세 동행) ====================== */
function TwinsView({ dark }) {
  const T = TWINS;
  const eok = (n) => (n / 1e8).toFixed(2) + "억";
  const bandPct = (sstd) => ((Math.exp(sstd) - 1) * 100).toFixed(0); // 로그 스프레드 std → 평소 ±% 밴드
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const opts = useMemo(() => (T ? T.complexes.map((c, i) => ({ i, label: c.region + " " + c.apt + " (" + eok(c.price) + ")" })) : []), []);
  const filtered = useMemo(() => (q ? opts.filter((o) => o.label.replace(/\s/g, "").includes(q.replace(/\s/g, ""))) : opts).slice(0, 60), [q, opts]);
  if (!T || !T.complexes || !T.complexes.length) {
    return <div className="rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass p-8 text-center text-sm text-slate-500">쌍둥이 분석 데이터가 없습니다. (node molit_twins.mjs 후 빌드 필요)</div>;
  }
  const selC = T.complexes[sel];
  const neighbors = (T.topNeighbors[sel] || []).map((n) => ({ ...n, c: T.complexes[n.j] }));
  const card = "rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass shadow-sm";

  return (
    <div className="space-y-6">
      <div className={card + " p-5"}>
        <h3 className="flex items-center gap-1.5 text-lg font-bold text-slate-900 dark:text-white"><Icon.TrendUp size={18} /> 쌍둥이 단지 — 추세 동행 분석</h3>
        <p className="mt-1 text-xs text-slate-500 dark:text-slate-400">국토교통부 <b>실거래가</b>(전용 84㎡ 기준) {T.period[0]}~{T.period[1]} 월별 중위가로, 가격이 <b>함께 움직이는(동행)</b> 단지 쌍을 찾습니다.
          동행도 <b>r</b>(레벨 상관)이 높고 두 단지 가격차가 <b>평소 좁은 밴드</b>에서 안정적일수록 쌍둥이입니다. 분석단지 {T.complexCount.toLocaleString()}개 · 동행쌍 {T.pairCount.toLocaleString()}개.</p>
      </div>

      {/* 갈아타기 신호 */}
      <div className={card + " p-5"}>
        <h4 className="flex items-center gap-1.5 text-base font-bold text-slate-900 dark:text-white"><Icon.TrendDown size={17} /> 갈아타기 신호 TOP</h4>
        <p className="mt-1 mb-3 text-xs text-slate-500 dark:text-slate-400">평소 강하게 동행(r≥0.9·가격대 ±20%내)하던 쌍이 <b>현재 가격차가 평소보다 크게(z≥1.5σ) 벌어진</b> 경우 — 상대적으로 <b className="text-emerald-600 dark:text-emerald-400">싼 쪽</b>이 갈아타기 후보입니다. (호가 아닌 실거래 기반 · 참고용)</p>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr className="text-xs text-slate-500 dark:text-slate-400 border-b border-slate-200/70 dark:border-white/10">
              <th className="py-2 pr-2 text-left font-semibold">동행도</th><th className="py-2 px-2 text-left font-semibold">벌어짐</th>
              <th className="py-2 px-2 text-left font-semibold">비싼 쪽</th><th className="py-2 px-2 text-left font-semibold text-emerald-600 dark:text-emerald-400">싼 쪽(후보)</th>
              <th className="py-2 pl-2 text-right font-semibold">현재 격차</th></tr></thead>
            <tbody>
              {T.swaps.slice(0, 20).map((s, i) => (
                <tr key={i} className="border-b border-slate-100 dark:border-white/5 hover:bg-slate-50 dark:hover:bg-white/5">

                  <td className="py-2 px-2 text-xs font-semibold text-amber-600 dark:text-amber-400">{s.z}σ</td>

                  <td className="py-2 pl-2 text-right font-bold text-slate-700 dark:text-slate-200">{s.gapPct}%</td>
                </tr>

            </tbody>

          <div className="max-h-[420px] space-y-1 overflow-y-auto pr-1">
            {filtered.map((o) => (
              <button key={o.i} onClick={() => setSel(o.i)} className={"w-full rounded-lg px-3 py-2 text-left text-sm transition " + (o.i === sel ? "bg-brand-500/15 font-semibold text-brand-700 dark:text-brand-200" : "hover:bg-slate-100 dark:hover:bg-white/5 text-slate-600 dark:text-slate-300")}>{o.label}</button>
            ))}
            {!filtered.length && <p className="px-3 py-4 text-center text-xs text-slate-400">검색 결과 없음</p>}

            <span className="text-xs text-slate-400">{selC.buildYear ? selC.buildYear + "년 준공" : ""} · 실거래 {selC.months}개월</span>
          </div>
          <p className="mb-3 text-xs text-slate-500 dark:text-slate-400">이 단지와 가격이 가장 <b>안정적으로 동행</b>해 온 쌍둥이 단지들 (가격차가 평소 좁은 순)</p>
          {neighbors.length ? (
            <div className="space-y-2">
              {neighbors.map((n, i) => {
                const gap = ((selC.price / n.c.price - 1) * 100);
                return (
                  <div key={i} className="flex items-center justify-between gap-3 rounded-xl border border-slate-100 dark:border-white/5 bg-white/60 dark:bg-white/[0.02] px-4 py-3">

                      <span className="rounded-md bg-brand-500/10 px-2 py-1 font-bold text-brand-600 dark:text-brand-300" title="레벨 상관(동행도)">r={n.r}</span>
                      <span className="rounded-md bg-slate-500/10 px-2 py-1 font-semibold text-slate-500 dark:text-slate-400" title="가격차 평소 변동폭">±{bandPct(n.sstd)}%</span>
                      <span className={"w-16 text-right font-bold " + (gap >= 0 ? "text-rose-500" : "text-emerald-500")}>{gap >= 0 ? "+" : ""}{gap.toFixed(0)}%</span>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : <p className="py-6 text-center text-sm text-slate-400">이 단지와 강하게 동행하는 쌍둥이가 발견되지 않았습니다.</p>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [dark, setDark] = useState(() => {
    const s = localStorage.getItem("apt-theme");
    if (s) return s === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  });
  useEffect(() => { document.documentElement.classList.toggle("dark", dark); localStorage.setItem("apt-theme", dark ? "dark" : "light"); }, [dark]);

  const [view, setView] = useState("main"); // main | twins
  const [overlay, setOverlayState] = useState(loadOverlay);
  const setOverlay = (o) => { saveOverlay(o); setOverlayState(o); };
  const editCount = useMemo(() => Object.values(overlay.edits || {}).reduce((n, e) => n + (e.history ? e.history.length : 0), 0) + (overlay.news || []).length + Object.keys(overlay.noListing || {}).length, [overlay]);

  /* ===== Firebase 실시간 동기화 (암호화) ===== */
  const [syncState, setSyncState] = useState("off"); // off | connecting | on
  const overlayRef = useRef(overlay);
  useEffect(() => { overlayRef.current = overlay; }, [overlay]);
  const syncRef = useRef(null), lastSync = useRef(null), syncReady = useRef(false);

  useEffect(() => {
    if (!ENC || !SYNC_PW || !window.firebase || !FIREBASE_CONFIG.databaseURL) return;
    let ref, alive = true;
    setSyncState("connecting");
    (async () => {
      try {
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        await firebase.auth().signInAnonymously();
        const path = await sha256hex(SYNC_PW);
        ref = firebase.database().ref("sync/" + path);
        syncRef.current = ref;
        ref.on("value", async (snap) => {
          if (!alive) return;
          const val = snap.val();
          try {
            if (!syncReady.current) {
              if (val) {
                const remote = await decryptData(val, SYNC_PW);
                const merged = mergeOverlay(overlayRef.current, remote); // 기기별 입력 보존
                lastSync.current = JSON.stringify(merged); saveOverlay(merged); setOverlayState(merged);
                if (JSON.stringify(merged) !== JSON.stringify(remote)) ref.set(await encryptData(merged, SYNC_PW)).catch(() => {});
              } else { const cur = overlayRef.current; lastSync.current = JSON.stringify(cur); ref.set(await encryptData(cur, SYNC_PW)).catch(() => {}); }
              syncReady.current = true; setSyncState("on"); return;
            }
            if (!val) return;
            const remote = await decryptData(val, SYNC_PW);
            const rjson = JSON.stringify(remote);
            if (rjson === lastSync.current) return; // 자기 자신 echo
            lastSync.current = rjson; saveOverlay(remote); setOverlayState(remote);
          } catch (e) {}
        });
      } catch (e) { console.warn("sync init 실패", e); setSyncState("off"); }
    })();
    return () => { alive = false; if (ref) ref.off(); };
  }, []);

  // 로컬 변경 → 원격 반영
  useEffect(() => {
    if (!syncReady.current || !syncRef.current || !SYNC_PW) return;
    const json = JSON.stringify(overlay);
    if (json === lastSync.current) return;
    lastSync.current = json;
    (async () => { try { await syncRef.current.set(await encryptData(overlay, SYNC_PW)); } catch (e) {} })();
  }, [overlay]);

  const RECORDS = useMemo(() => {
    const manualKeys = new Set();
    if (STATUS) Object.entries(overlay.edits || {}).forEach(([k, ed]) => { if ((ed.history || []).some((h) => h.date >= STATUS.date)) manualKeys.add(k); });
    const recs = buildDataset(overlay).map((d) => deriveMetrics(d, manualKeys, overlay.noListing || {}));
    // 저평가 스코어 = 전세가율 백분위(0.65) + 평당가 저렴도 백분위(0.35), 0~100
    const ratios = recs.filter((r) => r.jeonseRatio != null).map((r) => r.jeonseRatio).sort((a, b) => a - b);
    const pps = recs.filter((r) => r.latestPP != null).map((r) => r.latestPP).sort((a, b) => a - b);
    const pctl = (arr, v) => (arr.length ? arr.filter((x) => x <= v).length / arr.length : 0);
    recs.forEach((r) => {
      if (r.jeonseRatio != null) {
        const rp = pctl(ratios, r.jeonseRatio);
        const cp = r.latestPP != null ? 1 - pctl(pps, r.latestPP) : 0.5;
        r.valueScore = Math.round(100 * (0.65 * rp + 0.35 * cp));
      } else r.valueScore = null;
    });
    return recs;
  }, [overlay]);
  const PROVINCES = useMemo(() => [...new Set(RECORDS.map((r) => r.province))], [RECORDS]);

  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [cid, setCid] = useState(RECORDS[0] ? RECORDS[0]._id : "");
  const [modal, setModal] = useState(false);
  const [moversOpen, setMoversOpen] = useState(false);
  const [prefillDate, setPrefillDate] = useState(TODAY);
  const [tableFilter, setTableFilter] = useState(""); // "" 전체 | "pending" 미완료 | "none" 매물없음

  // 업데이트 현황 요약 (필터 적용된 pool 기준은 아래에서, 전체 기준은 RECORDS로)
  const upd = useMemo(() => {
    if (!STATUS) return null;
    const c = { success: 0, partial: 0, nomatch: 0, error: 0, resolved: 0, none_confirmed: 0 };
    RECORDS.forEach((r) => { if (r.updateStatus) c[r.updateStatus] = (c[r.updateStatus] || 0) + 1; });
    return { date: STATUS.date, ...c, pending: c.partial + c.nomatch + c.error };
  }, [RECORDS]);

  const openInput = (r) => { setPrefillDate(STATUS ? STATUS.date : TODAY); setCid(r._id); setModal(true); };
  // 누락된 쪽(매매/전세)을 자동 판별해 '매물없음' 표시
  const markNoneAuto = (r) => {
    const h = STATUS ? r.history.find((x) => x.date === STATUS.date) : null;
    const hasDeal = !!(h && h.price != null), hasRent = !!(h && h.rent != null);
    const nl = { ...(overlay.noListing || {}) };
    nl[r._id] = { deal: !hasDeal, rent: !hasRent };
    setOverlay({ ...overlay, noListing: nl });
  };
  const clearNone = (r) => {
    const nl = { ...(overlay.noListing || {}) };
    delete nl[r._id];
    setOverlay({ ...overlay, noListing: nl });
  };

  const district2 = useMemo(() => {
    const pool = p1 ? RECORDS.filter((r) => r.province === p1) : RECORDS;
    return [...new Set(pool.map((r) => r.district))].sort((a, b) => a.localeCompare(b, "ko"));
  }, [p1, RECORDS]);

  const pool = useMemo(() => RECORDS.filter((r) => (!p1 || r.province === p1) && (!p2 || r.district === p2)), [p1, p2, RECORDS]);
  const complexOpts = useMemo(() => [...pool].sort((a, b) => a.complex_name.localeCompare(b.complex_name, "ko")).map((r) => ({ value: r._id, label: r.complex_name + " (" + r.district + ")" })), [pool]);

  const onP1 = (v) => { setP1(v); setP2(""); };
  useEffect(() => { if (pool.length && !pool.some((r) => r._id === cid)) setCid(pool[0]._id); }, [pool]); // eslint-disable-line
  const selected = useMemo(() => RECORDS.find((r) => r._id === cid) || null, [cid, RECORDS]);

  const kpi = useMemo(() => {
    const wc = pool.filter((r) => r.changePct != null);
    const top = wc.reduce((m, r) => (!m || r.changePct > m.changePct ? r : m), null);
    const bottom = wc.reduce((m, r) => (!m || r.changePct < m.changePct ? r : m), null);
    const ratios = pool.map((r) => r.jeonseRatio).filter((v) => v != null);
    const avgRatio = ratios.length ? ratios.reduce((a, b) => a + b, 0) / ratios.length : null;
    return { count: pool.length, top, bottom, avgRatio };
  }, [pool]);

  const scope = (p1 || "전국") + (p2 ? " · " + p2 : "");

  const exportJson = () => {
    const data = buildDataset(overlay);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "apartment_data.json"; a.click();
    URL.revokeObjectURL(url);
  };
  const resetOverlay = () => { if (confirm("이 브라우저에 저장한 입력/추가 내역을 모두 지울까요? (원본 데이터는 유지)")) setOverlay({ edits: {}, news: [] }); };

  return (
    <div className="mx-auto max-w-[1400px] px-4 py-6 sm:px-6 lg:px-8">
      <header className="flex flex-wrap items-center justify-between gap-4">
        <div className="flex items-center gap-3">
          <div className="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-violet-600 text-white shadow-lg shadow-brand-500/30"><Icon.Building size={24} /></div>
          <div>
            <h1 className="text-xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-2xl">아파트 시세 트래킹</h1>
            <p className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1.5 flex-wrap">
              <span>서울·경기 주요 단지 시세 분석 대시보드{editCount > 0 ? " · 내 입력 " + editCount + "건" : ""}</span>
              {syncState === "on" && <span className="inline-flex items-center gap-1 rounded-md bg-emerald-500/10 px-1.5 py-0.5 font-semibold text-emerald-600 dark:text-emerald-400">● 동기화</span>}
              {syncState === "connecting" && <span className="inline-flex items-center gap-1 rounded-md bg-slate-400/10 px-1.5 py-0.5 font-semibold text-slate-500">동기화 연결 중…</span>}
            </p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => { setPrefillDate(TODAY); setModal(true); }} className="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-br from-brand-500 to-violet-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-brand-500/30 transition hover:brightness-110"><Icon.Plus size={17} /> 시세 입력</button>
          <button onClick={exportJson} title="JSON 내보내기" className="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 px-3.5 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-300 shadow-sm transition hover:bg-slate-50 dark:hover:bg-white/10"><Icon.Download size={17} /> <span className="hidden sm:inline">내보내기</span></button>
          {editCount > 0 && <button onClick={resetOverlay} title="내 입력 초기화" className="inline-flex items-center rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 p-2.5 text-slate-500 shadow-sm transition hover:text-rose-500"><Icon.Trash size={17} /></button>}
          <button onClick={() => setDark((d) => !d)} className="inline-flex items-center gap-2 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 p-2.5 text-slate-600 dark:text-slate-300 shadow-sm transition hover:bg-slate-50 dark:hover:bg-white/10">{dark ? <Icon.Sun size={18} /> : <Icon.Moon size={18} />}</button>
        </div>
      </header>

      {TWINS && (
        <nav className="mt-6 inline-flex rounded-xl border border-slate-200/70 dark:border-white/10 bg-slate-100/70 dark:bg-white/5 p-1">
          {[{ k: "main", label: "시세 대시보드" }, { k: "twins", label: "쌍둥이 단지" }].map((t) => (
            <button key={t.k} onClick={() => setView(t.k)} className={"rounded-lg px-4 py-2 text-sm font-semibold transition " + (view === t.k ? "bg-white dark:bg-slate-700 text-brand-600 dark:text-white shadow-sm" : "text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200")}>{t.label}</button>
          ))}
        </nav>
      )}

      {view === "twins" ? (
        <div className="mt-6"><TwinsView dark={dark} /></div>
      ) : (
      <>
      <section className="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <KpiCard icon={Icon.Building} label={"트래킹 단지 수 · " + scope} value={kpi.count.toLocaleString() + "개"} sub="필터 적용 기준" tone="brand" delay={0} />
        <KpiCard icon={Icon.TrendUp} label="직전 대비 최고 상승" value={kpi.top ? signPct(kpi.top.changePct) : "-"} sub={kpi.top ? kpi.top.complex_name : "데이터 없음"} tone="rose" delay={60} onClick={() => setMoversOpen(true)} />
        <KpiCard icon={Icon.TrendDown} label="직전 대비 최고 하락" value={kpi.bottom ? signPct(kpi.bottom.changePct) : "-"} sub={kpi.bottom ? kpi.bottom.complex_name : "데이터 없음"} tone="emerald" delay={120} onClick={() => setMoversOpen(true)} />
        <KpiCard icon={Icon.Percent} label="평균 전세가율" value={pct(kpi.avgRatio)} sub={scope + " 평균"} tone="amber" delay={180} />
      </section>

      {upd && (
        <section className="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass px-5 py-3.5 shadow-sm animate-fade-up">
          <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-sm">
            <span className="font-semibold text-slate-700 dark:text-slate-200">최근 업데이트 {upd.date}</span>
            <span className="text-emerald-600 dark:text-emerald-400">성공 {upd.success}</span>
            {upd.partial > 0 && <span className="text-amber-600 dark:text-amber-400">매매누락 {upd.partial}</span>}
            {upd.nomatch > 0 && <span className="text-slate-500 dark:text-slate-400">미수집 {upd.nomatch}</span>}
            {upd.error > 0 && <span className="text-rose-600 dark:text-rose-400">실패 {upd.error}</span>}
            {upd.resolved > 0 && <span className="text-blue-600 dark:text-blue-400">수동보완 {upd.resolved}</span>}
            {upd.none_confirmed > 0 && <button onClick={() => setTableFilter("none")} className="rounded-md text-slate-500 dark:text-slate-400 underline decoration-dotted underline-offset-2 hover:text-slate-700 dark:hover:text-slate-200">매물없음 {upd.none_confirmed} ↗</button>}
          </div>
          {upd.pending > 0 ? (
            <button onClick={() => setTableFilter("pending")} className="inline-flex items-center gap-1.5 rounded-xl bg-rose-500/10 px-3.5 py-2 text-sm font-semibold text-rose-600 dark:text-rose-400 transition hover:bg-rose-500/20">
              미완료 {upd.pending}개 입력 필요 →
            </button>
          ) : (
            <span className="rounded-xl bg-emerald-500/10 px-3.5 py-2 text-sm font-semibold text-emerald-600 dark:text-emerald-400">모두 업데이트 완료 🎉</span>
          )}
        </section>
      )}

      <section className="mt-6"><RatioTrend rows={pool} dark={dark} /></section>
      <section className="mt-6"><ValueScreen rows={pool} onPick={(r) => setCid(r._id)} /></section>

      <div className="mt-6 grid grid-cols-1 gap-6 xl:grid-cols-3">
        <section className="xl:col-span-2">
          <div className="rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass p-5 shadow-sm">
            <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
              <Select icon={Icon.Map} label="지역1" value={p1} onChange={onP1} placeholder="전체 (서울+경기)" options={PROVINCES.map((p) => ({ value: p, label: p }))} />
              <Select icon={Icon.Layers} label="지역2 (자치구/시)" value={p2} onChange={setP2} placeholder="전체" options={district2.map((d) => ({ value: d, label: d }))} />
              <Select icon={Icon.Building} label="단지명" value={cid} onChange={setCid} options={complexOpts} />
            </div>
          </div>
          <div className="mt-6 rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass p-5 shadow-sm"><ChartPanel complex={selected} dark={dark} /></div>
        </section>
        <section className="xl:col-span-1">
          <div className="rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/70 dark:bg-white/[0.03] glass p-5 shadow-sm"><RankingTable rows={pool} onPick={(r) => setCid(r._id)} selectedId={cid} tableFilter={tableFilter} setTableFilter={setTableFilter} onInput={openInput} onMarkNone={markNoneAuto} onClearNone={clearNone} /></div>
        </section>
      </div>

      <InputModal open={modal} onClose={() => setModal(false)} records={RECORDS} defaultId={cid} defaultDate={prefillDate} overlay={overlay} setOverlay={setOverlay} />
      {moversOpen && <MoversModal rows={pool} onClose={() => setMoversOpen(false)} />}
      </>
      )}

      <footer className="mt-10 border-t border-slate-200/70 dark:border-white/10 pt-5 text-center text-xs text-slate-400">{view === "twins" ? "쌍둥이 분석은 국토교통부 실거래가(전용 84㎡) 기반입니다 · 투자 판단의 책임은 이용자 본인에게 있습니다." : "데이터는 네이버 부동산 최저가 기준 수기 트래킹값입니다 · 투자 판단의 책임은 이용자 본인에게 있습니다."}</footer>
    </div>
  );
}
/* ====================== 암호 게이트 (암호 빌드 전용) ====================== */
function Gate() {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  const submit = async (e) => {
    if (e) e.preventDefault();
    setBusy(true); setErr("");
    try { const obj = await decryptData(ENC, pw); RAW = obj.data || []; STATUS = obj.status || null; SYNC_PW = pw; setOk(true); }
    catch (er) { setErr("비밀번호가 올바르지 않습니다."); setBusy(false); }
  };
  if (ok) return <App />;
  return (
    <div className="flex min-h-screen items-center justify-center px-4">
      <form onSubmit={submit} className="w-full max-w-sm rounded-2xl border border-slate-200/70 dark:border-white/10 bg-white/80 dark:bg-white/[0.03] glass p-7 shadow-xl">
        <div className="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-violet-600 text-white shadow-lg shadow-brand-500/30"><Icon.Building size={26} /></div>
        <h1 className="text-center text-lg font-bold text-slate-900 dark:text-white">아파트 시세 트래킹</h1>
        <p className="mt-1 text-center text-xs text-slate-500 dark:text-slate-400">비밀번호를 입력하세요</p>
        <input type="password" autoFocus value={pw} onChange={(e) => setPw(e.target.value)} placeholder="비밀번호"
          className="mt-5 w-full rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 px-3.5 py-2.5 text-sm outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-400/30" />
        {err && <p className="mt-2 text-xs font-medium text-rose-500">{err}</p>}
        <button type="submit" disabled={busy || !pw} className="mt-4 w-full rounded-xl bg-gradient-to-br from-brand-500 to-violet-600 px-4 py-2.5 text-sm font-bold text-white shadow-lg shadow-brand-500/30 transition hover:brightness-110 disabled:opacity-50">{busy ? "확인 중…" : "열기"}</button>
      </form>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(ENC ? <Gate /> : <App />);
